name: Render backend keep-alive

on:
  schedule:
    # Every 10 minutes — Render free instances spin down after 15 minutes
    # of inactivity, so ping inside that window to avoid cold starts.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Keep Render backend awake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://mccassets-backend.onrender.com' }}
    steps:
      - name: Ping health endpoint
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "${BACKEND_URL}/api/health")
          echo "GET /api/health -> HTTP ${status}"
          cat /tmp/health.json || true
          [ "$status" = "200" ]
