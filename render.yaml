# Render blueprint — deploys the backend service.
# This is an npm-workspaces monorepo: the lockfile lives at the repo root, so
# install/build/start run at the root and target the `backend` workspace.
# Set SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and CORS_ORIGIN in the dashboard.
# Note: with NODE_ENV=production, npm skips devDependencies by default, so the
# build must explicitly install them (`--include=dev`) to get typescript, tsc
# and the @types packages used by the type-check step.

services:
  - type: web
    name: mcas-ict-backend
    runtime: node
    buildCommand: npm ci --include=dev && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false